<!doctype html>
<html lang="en">

</head>

  <main id="card">
    <button id="fresh" title="Refresh"><span id="fresh-text"></span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.2 8a5.2 5.2 0 1 1-1.6-3.75M13.4 2.2v3h-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
