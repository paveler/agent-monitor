# Windows port: tests on every change in windows/, and a release build on a `win-v*` tag.
# The release is published next to the macOS ones but never marked "latest":
# the Homebrew cask's livecheck follows the latest release.
name: Windows

on:
  push:
    branches: [main]
    paths: ["windows/**", ".github/workflows/windows.yml"]
    tags: ["win-v*"]
  pull_request:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/win-v')
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          [ "win-v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != tauri.conf.json $version"; exit 1; }

      - name: Build (exe + NSIS installer)
        run: |
          npm ci
          npm run installer

      - name: Collect artifacts
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p dist
          cp src-tauri/target/release/agent-monitor.exe "dist/AgentMonitor-$version-portable.exe"
          cp src-tauri/target/release/bundle/nsis/*-setup.exe "dist/AgentMonitor-$version-setup.exe"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: agent-monitor-windows
          path: windows/dist/*.exe

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/win-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Agent Monitor for Windows ${{ github.ref_name }}
          files: windows/dist/*.exe
          make_latest: false
          body: |
            Agent Monitor for Windows: usage limits for Claude Code and Codex, and which sessions are waiting on you, as a desktop widget with a tray icon. Port by @SmileXYZ.

            - `AgentMonitor-*-setup.exe`: installer (per user, no admin rights).
            - `AgentMonitor-*-portable.exe`: a single exe, no install.

            The build isn't code-signed, so SmartScreen will warn on first launch: **More info → Run anyway**.

            After launch: click **Connect Claude Code** / **Connect Codex** in the widget, restart open sessions, and turn on **Launch at Login** in the tray menu. See [windows/README.md](https://github.com/paveler/agent-monitor/blob/main/windows/README.md).
